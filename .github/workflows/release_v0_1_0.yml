name: release-v0.1.0

on:
  push:
    branches: [main]
    paths:
      - 'release/v0.1.0.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or synchronize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 \
              --title "v0.1.0 — Basic Formal Reproducibility" \
              --notes-file RELEASE_NOTES_v0.1.0.md
          else
            gh release create v0.1.0 \
              --target "${GITHUB_SHA}" \
              --title "v0.1.0 — Basic Formal Reproducibility" \
              --notes-file RELEASE_NOTES_v0.1.0.md
          fi
